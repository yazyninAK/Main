# Настройки мониторинга объявлений.
#
# Этот файл можно редактировать прямо на GitHub (кнопка "карандаш" на
# странице файла в репозитории) — не нужно ничего скачивать или запускать.
# Изменения подхватятся автоматически при следующем запуске по расписанию,
# либо запустите проверку сразу вручную: вкладка Actions → "Monitor mali
# oglasi" → Run workflow.

# ФИЛЬТРЫ САЙТА — соответствуют левой панели фильтров на 2bike.rs.
# Меняются простыми текстовыми полями, без URL. Это ОБЩИЙ источник для
# всех наборов фильтров ниже — категория/страница объявлений одна, а
# наборов условий (must_include/criteria) может быть несколько.
site:
  # Категория объявлений.
  category_url: "https://2bike.rs/cikloberza/mali-oglasi/bicikli-6/elektricni-bicikli-13"

  # Скрыть проданные объявления.
  hide_sold: true

  # Скрыть объявления без указанной цены.
  hide_no_price: false

  # Бренды велосипеда (фильтр "PROIZVOĐAČ" на сайте). Пусто — без ограничения.
  # Список доступных названий — в scripts/scraper.py, словарь BRAND_IDS.
  # Пример: brands: ["Cube", "Trek"]
  brands: []

  # Диапазон цены. null — без ограничения. Валюта — price_currency (EUR/RSD).
  price_min: null
  price_max: null
  price_currency: "EUR"

# ИМЕНОВАННЫЕ НАБОРЫ ФИЛЬТРОВ. Каждое новое объявление проверяется по
# ВСЕМ наборам ниже (не только по первому подошедшему). Если объявление
# подходит сразу под несколько наборов — в уведомлении будут перечислены
# все совпавшие имена.
#
# Чтобы добавить новый набор — скопируйте один блок "- name: ..." целиком
# (от "- name:" до следующего "- name:" или до конца файла) и в копии
# измените название и условия. Чтобы временно отключить набор — удалите
# его блок или закомментируйте каждую его строку символом "#".
filters:
  - name: "Bosch Gen5, M/L, 700Wh+, до 1500км"

    # ОБЯЗАТЕЛЬНЫЕ признаки (текстовый поиск по объявлению — сайт не даёт
    # фильтр по поколению мотора, поэтому ищем по тексту). Объявление
    # должно содержать совпадение хотя бы одного слова из КАЖДОЙ группы
    # ниже (группы между собой — И, слова внутри группы (any_of) — ИЛИ).
    # Сравнение по заголовку + полному тексту страницы объявления, без
    # учёта регистра.
    #
    # Примеры:
    #   - Добавить синоним/вариант написания к существующему критерию —
    #     дописать строку в соответствующий any_of.
    #   - Добавить совсем новый обязательный критерий — добавить ещё один
    #     блок "- any_of: [...]" в конец списка.
    #   - Убрать критерий — удалить его блок (или закомментировать).
    must_include:
      - any_of:
          - "bosch"
      - any_of:
          - "gen 5"
          - "gen5"
          - "gen.5"
          - "gen. 5"
          - "generation 5"
          - "generacija 5"
          - "generacije 5"
          - "5. generacije"
          - "peta generacija"
          - "cx5"
          - "cx 5"
          - "cx-5"

    # ДОПОЛНИТЕЛЬНЫЕ КРИТЕРИИ (числовые/технические характеристики) — сайт
    # не даёт под них отдельный фильтр, поэтому ищем в тексте объявления.
    # Это эвристика, не точный разбор: критерий отклоняет объявление,
    # только если значение НАЙДЕНО в тексте и не подходит под условие.
    # Если значение явно не указано — объявление не отклоняется (лучше
    # показать лишнее, чем случайно пропустить нужное).
    criteria:
      # Минимальная ёмкость батареи, Втч (Wh). null — не проверять.
      battery_wh_min: 700

      # Максимальный пробег, км. null — не проверять.
      mileage_km_max: 1500

      # Допустимые размеры рамы. Пусто [] — не проверять.
      frame_sizes: ["M", "L"]

    # СТОП-СЛОВА. Если в объявлении встретится ЛЮБОЕ из этих слов — оно
    # пропускается под этим набором, даже если остальные условия совпали.
    # Полезно, чтобы отсеять объявления "куплю/ищу", запчасти и т.п.
    exclude_any: []

  # Пример второго набора (отключён — удалите "#" в начале строк, чтобы
  # включить, и настройте под свои условия):
  # - name: "Второй набор (пример)"
  #   must_include:
  #     - any_of: ["shimano"]
  #   criteria:
  #     battery_wh_min: null
  #     mileage_km_max: null
  #     frame_sizes: []
  #   exclude_any: []
