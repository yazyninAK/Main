# Настройки мониторинга объявлений
#
# url — уже отфильтрованная сайтом категория (это надёжнее и быстрее,
# чем скачивать весь раздел и фильтровать вручную).
url: "https://2bike.rs/cikloberza/mali-oglasi/bicikli-6/elektricni-bicikli-13"

# Критерии фильтрации по тексту объявления (заголовок + текст на странице
# объявления). Пост проходит фильтр, только если содержит совпадение
# ХОТЯ БЫ ОДНОГО слова из КАЖДОЙ группы (группы между собой — И,
# слова внутри группы — ИЛИ). Сравнение без учёта регистра.
#
# Чтобы добавить новый критерий позже — добавьте ещё одну группу any_of.
filters:
  - any_of:
      - "bosch"
  - any_of:
      - "gen 5"
      - "gen5"
      - "gen.5"
      - "gen. 5"
      - "generation 5"
      - "generacija 5"
      - "generacije 5"
      - "5. generacije"
      - "peta generacija"
