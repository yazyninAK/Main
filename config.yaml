# Настройки мониторинга объявлений.
#
# Этот файл можно редактировать прямо на GitHub (кнопка "карандаш" на
# странице файла в репозитории) — не нужно ничего скачивать или запускать.
# Изменения подхватятся автоматически при следующем запуске по расписанию,
# либо запустите проверку сразу вручную: вкладка Actions → "Monitor mali
# oglasi" → Run workflow.

# ИМЕНОВАННЫЕ НАБОРЫ ФИЛЬТРОВ. Каждое новое объявление проверяется по
# ВСЕМ наборам ниже (не только по первому подошедшему). Если объявление
# подходит сразу под несколько наборов — в уведомлении будут перечислены
# все совпавшие имена.
#
# У каждого набора СВОЯ категория сайта (site.category_url) — можно
# мониторить сразу разные разделы (например "Электровелосипеды" и "MTB
# велосипеды") разными наборами одновременно.
#
# Чтобы добавить новый набор — скопируйте блок целиком (от "- name:" до
# следующего "- name:" или до конца файла), вставьте копию и в ней
# измените название/условия. Чтобы отключить набор — удалите его блок
# или закомментируйте каждую его строку символом "#".
filters:
  - name: "Bosch Gen5, M/L, 700Wh+, до 1500км"

    # ФИЛЬТРЫ САЙТА — соответствуют левой панели фильтров на 2bike.rs.
    # Меняются простыми текстовыми полями, без URL.
    site:
      # Категория объявлений.
      category_url: "https://2bike.rs/cikloberza/mali-oglasi/bicikli-6/elektricni-bicikli-13"
      # Скрыть проданные объявления.
      hide_sold: true
      # Скрыть объявления без указанной цены.
      hide_no_price: false
      # Бренды велосипеда (фильтр "PROIZVOĐAČ"). Пусто — без ограничения.
      # Список названий — в scripts/scraper.py, словарь BRAND_IDS.
      brands: []
      # Диапазон цены на уровне сайта. null — без ограничения.
      price_min: null
      price_max: null
      price_currency: "EUR"

    # ОБЯЗАТЕЛЬНЫЕ признаки (текстовый поиск по объявлению). Объявление
    # должно содержать совпадение хотя бы одного слова из КАЖДОЙ группы
    # ниже (группы между собой — И, слова внутри группы (any_of) — ИЛИ).
    # Сравнение по заголовку + полному тексту страницы объявления, без
    # учёта регистра.
    #
    # Примеры:
    #   - Добавить синоним/вариант написания к существующему критерию —
    #     дописать строку в соответствующий any_of.
    #   - Добавить совсем новый обязательный критерий — добавить ещё один
    #     блок "- any_of: [...]" в конец списка.
    #   - Убрать критерий — удалить его блок (или закомментировать).
    must_include:
      - any_of:
          - "bosch"
      - any_of:
          - "gen 5"
          - "gen5"
          - "gen.5"
          - "gen. 5"
          - "generation 5"
          - "generacija 5"
          - "generacije 5"
          - "5. generacije"
          - "peta generacija"
          - "cx5"
          - "cx 5"
          - "cx-5"

    # ДОПОЛНИТЕЛЬНЫЕ КРИТЕРИИ (числовые/технические характеристики) — сайт
    # не даёт под них отдельный фильтр, поэтому ищем в тексте/данных
    # объявления. Это эвристика, не точный разбор: критерий отклоняет
    # объявление, только если значение НАЙДЕНО и не подходит под условие.
    # Если значение явно не указано — объявление не отклоняется (лучше
    # показать лишнее, чем случайно пропустить нужное).
    criteria:
      # Минимальная ёмкость батареи, Втч (Wh). null — не проверять.
      battery_wh_min: 700
      # Максимальный пробег, км. null — не проверять.
      mileage_km_max: 1500
      # Допустимые размеры рамы. Пусто [] — не проверять.
      frame_sizes: ["M", "L"]
      # Допустимые материалы рамы. Пусто [] — не проверять.
      frame_materials: []
      # Максимальная цена, EUR (берётся из цены объявления, не с сайта). null — без ограничения.
      price_eur_max: null

    # СТОП-СЛОВА. Если в объявлении встретится ЛЮБОЕ из этих слов — оно
    # пропускается под этим набором, даже если остальные условия совпали.
    exclude_any: []

  - name: "Карбоновый Мтб до 1000е"

    site:
      # Подкатегория "MTB bicikli".
      category_url: "https://2bike.rs/cikloberza/mali-oglasi/bicikli-6/mtb-bicikli-7"
      hide_sold: true
      hide_no_price: false
      brands: []
      price_min: null
      price_max: null
      price_currency: "EUR"

    # Пусто — нет обязательного текстового условия. Материал рамы ниже
    # задан как МЯГКИЙ критерий (criteria.frame_materials), а не жёсткое
    # must_include, потому что продавец часто не пишет слово "карбон"
    # явно, хотя рама карбоновая — такие объявления тоже нужно показывать.
    must_include: []

    criteria:
      battery_wh_min: null
      mileage_km_max: null
      # Показывать M/L, а также объявления без указанного размера рамы.
      # Отклоняется, только если явно указан ДРУГОЙ размер (например XL).
      frame_sizes: ["M", "L"]
      # Показывать карбон, а также объявления без указанного материала.
      # Отклоняется, только если явно указан ДРУГОЙ материал (алюминий,
      # сталь, титан).
      frame_materials: ["carbon"]
      # Показывать объявления с ценой до 1000 EUR, а также без указанной
      # цены. Отклоняется, только если цена указана и выше 1000 EUR.
      price_eur_max: 1000

    exclude_any: []
