# Настройки мониторинга объявлений.
#
# Этот файл можно редактировать прямо на GitHub (кнопка "карандаш" на
# странице файла в репозитории) — не нужно ничего скачивать или запускать.
# Изменения подхватятся автоматически при следующем запуске по расписанию,
# либо запустите проверку сразу вручную: вкладка Actions → "Monitor mali
# oglasi" → Run workflow.

# url — уже отфильтрованная сайтом категория (это надёжнее и быстрее,
# чем скачивать весь раздел и фильтровать вручную). Фильтры с левой панели
# сайта (бренд, цена, город, "скрыть проданное"/"скрыть без цены" и т.д.)
# добавляются в этот URL как есть — просто примените нужные галочки на
# сайте и скопируйте получившийся адрес из адресной строки браузера сюда.
# Сейчас применён параметр hideSold=1 — скрывает проданные объявления.
url: "https://2bike.rs/cikloberza/mali-oglasi/bicikli-6/elektricni-bicikli-13?hideSold=1"

# ОБЯЗАТЕЛЬНЫЕ признаки. Объявление должно содержать совпадение хотя бы
# одного слова из КАЖДОЙ группы ниже (группы между собой — И, слова внутри
# группы (any_of) — ИЛИ). Сравнение по заголовку + полному тексту страницы
# объявления, без учёта регистра.
#
# Примеры:
#   - Добавить синоним/вариант написания к существующему критерию —
#     дописать строку в соответствующий any_of.
#   - Добавить совсем новый обязательный критерий — добавить ещё один
#     блок "- any_of: [...]" в конец списка.
#   - Убрать критерий — удалить его блок (или закомментировать, поставив
#     "#" в начале каждой строки блока).
must_include:
  - any_of:
      - "bosch"
  - any_of:
      - "gen 5"
      - "gen5"
      - "gen.5"
      - "gen. 5"
      - "generation 5"
      - "generacija 5"
      - "generacije 5"
      - "5. generacije"
      - "peta generacija"

# СТОП-СЛОВА. Если в объявлении встретится ЛЮБОЕ из этих слов — оно
# пропускается, даже если все обязательные критерии выше совпали.
# Полезно, чтобы отсеять объявления "куплю/ищу", запчасти и т.п.
# Пока пусто — ничего не исключается.
exclude_any: []
