# Настройки мониторинга объявлений

url: "https://2bike.rs/cikloberza/mali-oglasi"

# Критерии фильтрации.
# Пост проходит фильтр, только если содержит совпадение
# ХОТЯ БЫ ОДНОГО слова из КАЖДОЙ группы (группы между собой — И,
# слова внутри группы — ИЛИ). Сравнение без учёта регистра.
# Чтобы добавить новый критерий позже — просто добавьте ещё одну группу.
filters:
  - any_of:
      - "elektricni"
      - "električni"
      - "e-bike"
      - "ebike"
      - "elektro"
  - any_of:
      - "bosch gen 5"
      - "bosch gen5"
      - "bosch smart system gen 5"
      - "bosch gen. 5"
