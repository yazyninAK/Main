name: Monitor mali oglasi

on:
  # No `schedule:` trigger - the target site's Cloudflare protection blocks
  # cloud/datacenter IPs (GitHub Actions included), even through a headless
  # browser. Monitoring now runs locally instead (see README's "Локальный
  # запуск" section). This workflow is kept for manual testing
  # (workflow_dispatch) in case cloud execution becomes viable again.
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a one-off test notification instead of the real check"
        type: boolean
        default: false
      scan_recent:
        description: "Scan a filter's category broadly and send a numbered-link digest, instead of the real check"
        type: boolean
        default: false
      scan_filter_name:
        description: "Filter profile name to scan (only used when scan_recent is checked)"
        type: string
        default: "Карбоновый Мтб до 1000е"
      scan_max_pages:
        description: "How many listing pages (32 items each) to scan (only used when scan_recent is checked)"
        type: string
        default: "15"

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-mali-oglasi
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        if: ${{ !inputs.test_notification }}
        run: playwright install --with-deps chromium

      - name: Send test notification
        if: ${{ inputs.test_notification }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_NOTIFY_USER: ${{ github.repository_owner }}
        run: python scripts/test_notify.py

      - name: Scan recent listings (digest)
        if: ${{ inputs.scan_recent }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_NOTIFY_USER: ${{ github.repository_owner }}
          SCAN_FILTER_NAME: ${{ inputs.scan_filter_name }}
          SCAN_MAX_PAGES: ${{ inputs.scan_max_pages }}
        run: python scripts/scan_recent.py

      - name: Run monitor
        if: ${{ !inputs.test_notification && !inputs.scan_recent }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_NOTIFY_USER: ${{ github.repository_owner }}
        run: python scripts/main.py

      - name: Commit updated state
        if: ${{ !inputs.test_notification && !inputs.scan_recent }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "Update seen posts state"
          git push
