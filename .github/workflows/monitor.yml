name: Monitor mali oglasi

on:
  schedule:
    # 07:00 and 19:00 UTC = 09:00 and 21:00 in Belgrade (CEST, UTC+2).
    - cron: "0 7,19 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a one-off test notification instead of the real check"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-mali-oglasi
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test notification
        if: ${{ inputs.test_notification }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_NOTIFY_USER: ${{ github.repository_owner }}
        run: python scripts/test_notify.py

      - name: Run monitor
        if: ${{ !inputs.test_notification }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_NOTIFY_USER: ${{ github.repository_owner }}
        run: python scripts/main.py

      - name: Commit updated state
        if: ${{ !inputs.test_notification }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "Update seen posts state"
          git push
